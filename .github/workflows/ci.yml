name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.8" \
            "pydantic-settings>=2.4" "sqlalchemy>=2.0" "alembic>=1.13" "httpx>=0.27" \
            "structlog>=24.4" "argon2-cffi>=23.1" "pandas>=2.2" "yfinance>=0.2.40" \
            "pytest>=8.3" "pytest-asyncio>=0.24" "ruff>=0.6"

      - name: Ruff 检查
        run: ruff check app tests

      - name: 运行测试
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker compose build
